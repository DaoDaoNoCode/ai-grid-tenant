apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    # Keep deployed resources when the root or a generated Application is removed.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
        revision: HEAD
        files:
          - path: apps/*/application.yaml
          # The usage-log store belongs to the dedicated-hub profile. A standard hub
          # already runs apps/ai-grid-o11y, so generating this app here would stand
          # up a second LokiStack and a second object bucket beside it.
          - path: apps/ai-grid-usage-logs/application.yaml
            exclude: true
          # Only the dedicated-hub profile installs cert-manager and registers clusters.
          - path: apps/cert-manager/application.yaml
            exclude: true
          - path: apps/argo-registration/application.yaml
            exclude: true
          # MaaS state on a labelled site is applied by hand, never generated.
          - path: apps/external-services/application.yaml
            exclude: true
          # ODF is generated separately once the hub's version is known.
          - path: apps/odf/application.yaml
            exclude: true
          - path: cluster-config/application.yaml
    # Only ODF needs cluster metadata. Wait for ACM registration and its
    # version label: the operator channel must match the hub's OpenShift version.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
              revision: HEAD
              files:
                - path: apps/odf/application.yaml
          - clusters:
              selector:
                matchLabels:
                  apps.open-cluster-management.io/cluster-name: local-cluster
                matchExpressions:
                  - key: openshiftVersion-major-minor
                    operator: Exists
  template:
    metadata:
      name: '{{.metadata.name}}'
      namespace: '{{.metadata.namespace}}'
    spec:
      project: '{{.spec.project}}'
      destination:
        server: '{{.spec.destination.server}}'
        namespace: '{{.spec.destination.namespace}}'
  templatePatch: |
    {{- $spec := .spec }}
    {{- if eq .metadata.name "odf" }}
    {{- $params := list (dict "name" "openshift.version" "value" (index .metadata.labels "openshiftVersion-major-minor")) }}
    {{- if eq (index .metadata.labels "ai-grid/odf-operatorgroup") "existing" }}
    {{- $params = append $params (dict "name" "operatorGroup.create" "value" "false") }}
    {{- end }}
    {{- $_ := set $spec.source.helm "parameters" $params }}
    {{- end }}
    spec: {{ $spec | toJson }}
