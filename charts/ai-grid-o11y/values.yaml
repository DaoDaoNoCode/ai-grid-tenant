# Namespace hosting the usage-logs stack (LokiStack, Perses dashboards, collector ServiceAccounts).
o11yNamespace: redhat-ods-monitoring
# Namespace of the ACM hub observability stack (ScrapeConfigs, rbac-query-proxy).
acmObservabilityNamespace: open-cluster-management-observability

lokiStack:
  size: 1x.demo
  retentionDays: 30
  storageClassName: gp3-csi
  # S3 endpoint used by the object-storage secret provisioned from the OBC credentials.
  s3Endpoint: https://s3.openshift-storage.svc:443
