apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: cluster-prometheus-datasource
  namespace: {{ .Values.o11yNamespace }}
spec:
  client:
    tls:
      caCert:
        certPath: /ca/service-ca.crt
        type: file
      enable: true
  config:
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: http://rbac-query-proxy.{{ .Values.acmObservabilityNamespace }}.svc.cluster.local:8080
        scrapeInterval: 5m
