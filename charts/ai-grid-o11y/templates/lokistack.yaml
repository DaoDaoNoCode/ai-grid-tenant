apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: usage-logs
  namespace: {{ .Values.o11yNamespace }}
spec:
  size: {{ .Values.lokiStack.size | quote }}
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
          - name: service.name
          - name: subscription
          - name: organization_id
          - name: user_id
          - name: model
          - name: response_type
          - name: kubernetes_namespace_name
          - name: cluster_name
          - name: cluster_id
      retention:
        days: {{ .Values.lokiStack.retentionDays }}
  storage:
    schemas:
      - version: v13
        effectiveDate: "2026-10-01"
    secret:
      name: usage-logs-object-storage
      type: s3
    tls:
      caName: openshift-service-ca-bundle
      caKey: service-ca.crt
  storageClassName: {{ .Values.lokiStack.storageClassName }}
  tenants:
    mode: openshift-logging
  managementState: Managed
