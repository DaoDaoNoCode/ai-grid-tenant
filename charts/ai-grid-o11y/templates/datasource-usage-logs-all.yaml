apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: usage-logs-all
  namespace: redhat-ods-monitoring
  annotations:
    # After the LokiStack (wave 2), whose gateway CA bundle it needs.
    argocd.argoproj.io/sync-wave: "3"
spec:
  config:
    display:
      name: "All usage (logs)"
    default: false
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: 'https://usage-logs-gateway-http.redhat-ods-monitoring.svc.cluster.local:8080/api/logs/v1/infrastructure'
            allowedEndpoints:
              - endpointPattern: "/loki/api/v1/query"
                method: GET
              - endpointPattern: "/loki/api/v1/query_range"
                method: GET
              - endpointPattern: "/loki/api/v1/labels"
                method: GET
              - endpointPattern: "/loki/api/v1/label/([a-zA-Z0-9_-]+)/values"
                method: GET
            secret: usage-logs-all-secret
  client:
    kubernetesAuth:
      enable: true
    tls:
      enable: true
      caCert:
        type: file
        certPath: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
