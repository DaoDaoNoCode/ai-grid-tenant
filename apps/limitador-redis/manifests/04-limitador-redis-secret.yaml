# apiVersion: v1
# kind: Secret
# metadata:
#   name: limitador-redis-auth
#   namespace: limitador-redis
# type: Opaque
# stringData:
#   password: "<redis-password>"
---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: limitador-redis-sentinel-auth
#   namespace: limitador-redis
# type: Opaque
# stringData:
#   password: "<sentinel-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: limitador-redis
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  URL: "redis://limitador-redis-master.limitador-redis.svc.cluster.local:6379"
  # Cross-cluster URL once Submariner service discovery is enabled:
  # URL: "redis://limitador-redis-master.limitador-redis.svc.clusterset.local:6379"
  # To enable authentication, create the Redis and Sentinel password Secrets
  # outside Git, then use a URL of this form:
  # URL: "redis://:<redis-password>@limitador-redis-master.limitador-redis.svc.cluster.local:6379"
