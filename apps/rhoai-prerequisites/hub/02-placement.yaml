# AI Grid members and the hub. Predicates are a union: a cluster matches either one.
# The hub pulls the grid-bootstrap image from the same registry, so it needs the pull
# secret whether or not it is a site. Any other managed cluster gets nothing.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-prerequisites-clusters
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            ai-grid/enabled: "true"
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
