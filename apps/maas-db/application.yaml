apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maas-db
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/kahowell/ai-grid-tenant.git
    targetRevision: HEAD
    path: apps/maas-db/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
