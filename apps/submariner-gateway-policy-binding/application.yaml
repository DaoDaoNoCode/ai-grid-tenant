apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: submariner-gateway-policy-binding
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/kahowell/ai-grid-tenant.git
    targetRevision: HEAD
    path: apps/submariner-gateway-policy-binding/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: submariner-gateway-nodes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - SkipDryRunOnMissingResource=true
