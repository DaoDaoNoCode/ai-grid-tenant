apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maas-db
resources:
  - manifests/secrets.yaml
  - manifests/signing-keys.yaml
  - manifests/database.yaml
  - manifests/keycloak.yaml
  - manifests/route.yaml
configMapGenerator:
  - name: keycloak-realm-import
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    files:
      - manifests/realms/saas-realm.json
      - manifests/realms/grid-tenant-1-idp-realm.json
      - manifests/realms/grid-tenant-2-idp-realm.json
