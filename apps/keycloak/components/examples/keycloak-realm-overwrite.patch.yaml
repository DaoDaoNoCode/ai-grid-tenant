# Mounts the example tenant IdP realms where the render-realm-import init
# container renders them for kc.sh import --override true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: maas-db
spec:
  template:
    spec:
      initContainers:
        - name: render-realm-import
          volumeMounts:
            - name: realm-overwrite-source
              mountPath: /opt/keycloak/realm-overwrite-source
              readOnly: true
      volumes:
        - name: realm-overwrite-source
          configMap:
            name: keycloak-realm-overwrite
