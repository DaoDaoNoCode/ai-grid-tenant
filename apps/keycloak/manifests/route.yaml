apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  host: keycloak-grid-sso.apps.ai-grid-1.qhdb.p1.openshiftapps.com
  to:
    kind: Service
    name: keycloak
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
