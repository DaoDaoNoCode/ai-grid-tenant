apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  # Every realm is imported only when it doesn't exist, so a new pod changes
  # no realm while the old one serves: roll without a gap.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      initContainers:
        - name: render-realm-import
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -Eeuo pipefail

              # keycloak-realm-import holds every realm, imported only when it
              # doesn't exist (create-only): saas and the example tenant IdP
              # realms hold runtime data (organizations, users, groups) that
              # must survive a restart. keycloak-saas-realm-sync applies Git
              # edits to saas.
              render_dir() {
                local source_dir=$1 target_dir=$2 source
                mkdir -p "$target_dir"
                for source in "$source_dir"/*.json; do
                  [[ -e "$source" ]] || continue
                  bash /opt/keycloak/realm-scripts/render-realm.sh < "$source" > "$target_dir/$(basename "$source")"
                done
              }

              render_dir /opt/keycloak/realm-import-source /opt/keycloak/data/import/create-only
          envFrom:
            - secretRef:
                name: keycloak-secrets
            - secretRef:
                name: keycloak-redirect-uris-secret
            - secretRef:
                name: keycloak-realm-sync-secret
            - configMapRef:
                name: keycloak-public-url
          env:
            - name: KEYCLOAK_SIGNING_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-signing-keystore-password
                  key: password
          volumeMounts:
            - name: realm-import-source
              mountPath: /opt/keycloak/realm-import-source
              readOnly: true
            - name: realm-scripts
              mountPath: /opt/keycloak/realm-scripts
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -Eeuo pipefail
              /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import/create-only --override false
              exec /opt/keycloak/bin/kc.sh start
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          envFrom:
            - secretRef:
                name: keycloak-secrets
            - configMapRef:
                name: keycloak-public-url
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: maas-db-rw
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_DB_TLS_MODE
              value: verify-server
            - name: KC_DB_TLS_TRUST_STORE_FILE
              value: /opt/keycloak/database-ca/ca.crt
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: keycloak-public-url
                  key: KEYCLOAK_PUBLIC_URL
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: database-ca
              mountPath: /opt/keycloak/database-ca
              readOnly: true
            - name: saas-signing-key
              mountPath: /opt/keycloak/data/saas
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: database-ca
          secret:
            secretName: maas-db-ca
        - name: saas-signing-key
          secret:
            secretName: keycloak-saas-signing
            items:
              - key: keystore.jks
                path: keystore.jks
        - name: realm-import-source
          configMap:
            name: keycloak-realm-import
        - name: realm-scripts
          configMap:
            name: keycloak-realm-scripts
        # The rendered realm files hold client secrets: keep them off the node's disk.
        - name: realm-import
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
