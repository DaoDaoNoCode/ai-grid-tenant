apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maas-db
resources:
  - manifests/secrets.yaml
  - manifests/signing-keys.yaml
  - manifests/database.yaml
  - manifests/public-url-policy.yaml
  - manifests/redirect-uris.yaml
  - manifests/keycloak.yaml
  - manifests/route.yaml
  - manifests/saas-realm-sync.yaml
configMapGenerator:
  # Realms imported only when they don't exist (kc.sh import --override false).
  - name: keycloak-realm-import
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    files:
      - manifests/realms/saas-realm.json
  - name: keycloak-realm-scripts
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    files:
      - manifests/scripts/render-realm.sh
      - manifests/scripts/sync-saas-realm.py
