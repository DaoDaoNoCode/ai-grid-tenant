# The direct installer runs these Jobs after Keycloak is ready, in order.
# Keep them out of the initial kubectl apply so they do not race the rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-sync-bootstrap
$patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-saas-realm-sync
$patch: delete
