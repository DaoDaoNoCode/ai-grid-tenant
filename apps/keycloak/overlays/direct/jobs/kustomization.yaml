apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maas-db
resources:
  - ../../../base/manifests/saas-realm-sync.yaml
patches:
  - path: ../../../components/examples/saas-realm-sync.patch.yaml
configMapGenerator:
  - name: keycloak-realm-import
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    files:
      - ../../../components/examples/saas-realm.json
      - ../../../components/examples/grid-tenant-1-idp-realm.json
      - ../../../components/examples/grid-tenant-2-idp-realm.json
  - name: keycloak-realm-scripts
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    files:
      - ../../../base/manifests/scripts/render-realm.sh
      - ../../../base/manifests/scripts/sync-saas-realm.py
