    - group: maas.opendatahub.io
      kind: MaasTenantConfig
      check: |
        hs = {}
        if obj.status == nil or (obj.status.conditions == nil and obj.status.phase == nil) then
          hs.status = "Progressing"
          hs.message = "Waiting for MaasTenantConfig status"
          return hs
        end
        if obj.status.phase == "Degraded" or obj.status.phase == "Failed" then
          hs.status = "Degraded"
          hs.message = "MaasTenantConfig phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = "MaasTenantConfig is pending"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Degraded" and condition.status == "True" then
            hs.status = "Degraded"
            hs.message = condition.message or "MaasTenantConfig is degraded"
            return hs
          end
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "MaasTenantConfig is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "MaasTenantConfig is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the MaasTenantConfig Ready condition"
        return hs
