apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The controller now caches both the in-cluster destination and the
  # GitOpsCluster proxy destination; 4 GiB is not enough during startup and
  # fan-out reconciliation.
  controller:
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 8Gi
  # Appended to the operator's default policy, which already grants Argo admin
  # to the OCM-managed `cluster-admins` Group; this adds the Git-managed
  # `ai-grid-admins` Group without touching `policy.default`.
  rbac:
    policy: |
      g, ai-grid-admins, role:admin
  # Statusless declarative resources such as ACM PlacementBinding and MetalLB
  # address pools rely on Argo's sync state; scripts/check-gitops-health-checks.sh
  # documents that exception when a new custom resource is added.
  resourceHealthChecks:
    - group: postgresql.cnpg.io
      kind: Cluster
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG cluster status"
          return hs
        end
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
          hs.message = obj.status.phase
          return hs
        end
        local degradedPhases = {
          ["Cluster is unrecoverable and needs manual intervention"] = true,
          ["Cluster cannot proceed to reconciliation due to an unknown plugin being required"] = true,
          ["Cluster cannot proceed to reconciliation due to an error while interacting with plugins"] = true,
          ["Cluster has incomplete or invalid image catalog"] = true,
          ["Invalid cluster definition"] = true
        }
        if degradedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = obj.status.phase
          if obj.status.phaseReason ~= nil then
            hs.message = hs.message .. ": " .. obj.status.phaseReason
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = obj.status.phase
        return hs
    - group: external-secrets.io
      kind: ExternalSecret
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalSecret status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ExternalSecret synchronized"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ExternalSecret synchronization failed"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ExternalSecret Ready condition"
        return hs
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status == nil or obj.status.state == nil or obj.status.installedCSV == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for the operator subscription to install"
          return hs
        end
        if obj.status.state == "AtLatestKnown" then
          hs.status = "Healthy"
          hs.message = "Operator subscription is at the latest known CSV"
          return hs
        end
        if obj.status.state == "Failed" then
          hs.status = "Degraded"
          hs.message = "Operator subscription failed"
          if obj.status.currentCSV ~= nil then
            hs.message = hs.message .. ": " .. obj.status.currentCSV
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Operator subscription state: " .. obj.status.state
        return hs
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for DataScienceCluster status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current DataScienceCluster generation"
          return hs
        end
        if obj.status.errorMessage ~= nil then
          hs.status = "Degraded"
          hs.message = obj.status.errorMessage
          return hs
        end
        if obj.status.phase == "Error" then
          hs.status = "Degraded"
          hs.message = "DataScienceCluster reconciliation failed"
          return hs
        end
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Degraded" and c.status == "True" then
            hs.status = "Degraded"
            hs.message = c.message or "DataScienceCluster is degraded"
            return hs
          end
        end
        if obj.status.phase == "Progressing" or obj.status.phase == "Not Ready" then
          hs.status = "Progressing"
          hs.message = "DataScienceCluster phase: " .. obj.status.phase
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "DataScienceCluster is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "DataScienceCluster is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the DataScienceCluster Ready condition"
        return hs
    - group: grid.praxis.fast
      kind: GridNetwork
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for GridNetwork status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current GridNetwork generation"
          return hs
        end
        if obj.status.phase == "Degraded" then
          hs.status = "Degraded"
          hs.message = "GridNetwork is degraded"
          return hs
        end
        if obj.status.phase ~= "Active" then
          hs.status = "Progressing"
          hs.message = "GridNetwork phase: " .. obj.status.phase
          return hs
        end
        local available = nil
        local progressing = false
        local degraded = false
        local message = "GridNetwork is active"
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Degraded" and condition.status == "True" then
            degraded = true
            message = condition.message or "GridNetwork is degraded"
          elseif condition.type == "Progressing" and condition.status == "True" then
            progressing = true
            message = condition.message or "GridNetwork is progressing"
          elseif condition.type == "Available" then
            available = condition.status == "True"
            message = condition.message or message
          end
        end
        if degraded then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if progressing then
          hs.status = "Progressing"
          hs.message = message
          return hs
        end
        if available == false then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        hs.status = "Healthy"
        hs.message = message
        return hs
    # GridSite is intentionally disabled: site discovery and enrollment can
    # remain Pending or Discovered independently of GitOps reconciliation.
    # - group: grid.praxis.fast
    #   kind: GridSite
    #   check: |
    #     hs = {}
    #     if obj.status == nil or obj.status.phase == nil then
    #       hs.status = "Progressing"
    #       hs.message = "Waiting for GridSite status"
    #       return hs
    #     end
    #     if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
    #       hs.status = "Progressing"
    #       hs.message = "Waiting for the current GridSite generation"
    #       return hs
    #     end
    #     if obj.status.phase == "Unreachable" then
    #       hs.status = "Degraded"
    #       hs.message = obj.status.message or "GridSite is unreachable"
    #       return hs
    #     end
    #     if obj.status.phase == "Active" or obj.status.phase == "Left" then
    #       hs.status = "Healthy"
    #       hs.message = obj.status.message or "GridSite phase: " .. obj.status.phase
    #       return hs
    #     end
    #     hs.status = "Progressing"
    #     hs.message = obj.status.message or "GridSite phase: " .. obj.status.phase
    #     return hs
    - group: grid.praxis.fast
      kind: InferenceProvider
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for InferenceProvider status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current InferenceProvider generation"
          return hs
        end
        if obj.status.phase == "Degraded" or obj.status.phase == "Unavailable" then
          hs.status = "Degraded"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider is pending"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Ready" and condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message or "InferenceProvider is not ready"
            return hs
          end
          if condition.type == "Degraded" and condition.status == "True" then
            hs.status = "Degraded"
            hs.message = condition.message or "InferenceProvider is degraded"
            return hs
          end
        end
        if obj.status.phase == "Available" then
          hs.status = "Healthy"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider is available"
          return hs
        end
        hs.status = "Progressing"
        hs.message = obj.status.reason or obj.status.message or "InferenceProvider phase: " .. obj.status.phase
        return hs
    - group: operator.openshift.io
      kind: ExternalSecretsConfig
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for External Secrets operand status"
          return hs
        end
        local ready = false
        local degraded = false
        local message = "Waiting for External Secrets operand conditions"
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            ready = condition.status == "True"
            message = condition.message or message
          elseif condition.type == "Degraded" and condition.status == "True" then
            degraded = true
            message = condition.message or message
          end
        end
        if degraded then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if ready then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = message
        return hs
    - group: generators.external-secrets.io
      kind: Password
      check: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Password generator resource is present"
        return hs
    - group: postgresql.cnpg.io
      kind: Database
      check: |
        hs = {}
        if obj.status == nil or obj.status.applied == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG database status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current CloudNativePG database generation"
          return hs
        end
        if obj.status.applied then
          hs.status = "Healthy"
          hs.message = "CloudNativePG database reconciliation applied"
          return hs
        end
        hs.status = "Degraded"
        hs.message = obj.status.message or "CloudNativePG database reconciliation failed"
        return hs
    - group: postgresql.cnpg.io
      kind: DatabaseRole
      check: |
        hs = {}
        if obj.status == nil or obj.status.applied == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG database role status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current CloudNativePG database role generation"
          return hs
        end
        if obj.status.applied then
          hs.status = "Healthy"
          hs.message = "CloudNativePG database role reconciliation applied"
          return hs
        end
        hs.status = "Degraded"
        hs.message = obj.status.message or "CloudNativePG database role reconciliation failed"
        return hs
    - group: route.openshift.io
      kind: Route
      check: |
        hs = {}
        if obj.status == nil or obj.status.ingress == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for OpenShift Route admission"
          return hs
        end
        for _, ingress in ipairs(obj.status.ingress) do
          local conditions = ingress.conditions or {}
          for _, condition in ipairs(conditions) do
            if condition.type == "Admitted" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or "OpenShift Route admitted"
                return hs
              elseif condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message or "OpenShift Route admission failed"
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the OpenShift Route Admitted condition"
        return hs
    - group: argoproj.io
      kind: ArgoCD
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ArgoCD operator status"
          return hs
        end
        if obj.status.phase == "Available" then
          hs.status = "Healthy"
          hs.message = "ArgoCD is available"
          return hs
        end
        if obj.status.phase == "Unknown" then
          hs.status = "Progressing"
          hs.message = "ArgoCD phase is unknown"
          return hs
        end
        hs.status = "Degraded"
        hs.message = "ArgoCD phase: " .. obj.status.phase
        return hs
    - group: argoproj.io
      kind: ApplicationSet
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ApplicationSet status"
          return hs
        end
        local generated = false
        local upToDate = false
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "ErrorOccurred" and condition.status == "True" then
            hs.status = "Degraded"
            hs.message = condition.message or "ApplicationSet generation failed"
            return hs
          end
          if condition.type == "ParametersGenerated" and condition.status == "True" then
            generated = true
          end
          if condition.type == "ResourcesUpToDate" and condition.status == "True" then
            upToDate = true
          end
        end
        if generated and upToDate then
          hs.status = "Healthy"
          hs.message = "ApplicationSet resources are up to date"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for ApplicationSet resources to be up to date"
        return hs
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        if obj.status == nil or obj.status.sync == nil or obj.status.health == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for Application status"
          return hs
        end
        if obj.status.health.status == "Degraded" then
          hs.status = "Degraded"
          hs.message = obj.status.health.message or "Application is degraded"
          return hs
        end
        if obj.status.sync.status == "Synced" and obj.status.health.status == "Healthy" then
          hs.status = "Healthy"
          hs.message = "Application is synced and healthy"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Application sync: " .. (obj.status.sync.status or "Unknown") .. "; health: " .. (obj.status.health.status or "Unknown")
        return hs
    - group: limitador.kuadrant.io
      kind: Limitador
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for Limitador status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current Limitador generation"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the Limitador Ready condition"
        return hs
    - group: multicluster.x-k8s.io
      kind: ServiceExport
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ServiceExport status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Valid" and condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message
            return hs
          end
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ServiceExport Ready condition"
        return hs
    - group: addon.open-cluster-management.io
      kind: ManagedClusterAddOn
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ManagedClusterAddOn status"
          return hs
        end
        local available = false
        local progressing = false
        local degradedTypes = {
          Degraded = true,
          SubmarinerAgentDegraded = true,
          SubmarinerConnectionDegraded = true,
          RouteAgentConnectionDegraded = true
        }
        for _, condition in ipairs(obj.status.conditions) do
          if condition.status == "True" then
            if degradedTypes[condition.type] then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            elseif condition.type == "Progressing" then
              progressing = true
            elseif condition.type == "Available" then
              available = true
            end
          end
        end
        if progressing then
          hs.status = "Progressing"
          hs.message = "ManagedClusterAddOn is progressing"
          return hs
        end
        if available then
          hs.status = "Healthy"
          hs.message = "ManagedClusterAddOn is available"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ManagedClusterAddOn Available condition"
        return hs
    - group: submarineraddon.open-cluster-management.io
      kind: SubmarinerConfig
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for SubmarinerConfig status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "SubmarinerConfigApplied" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the SubmarinerConfigApplied condition"
        return hs
    - group: serving.kserve.io
      kind: LLMInferenceService
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for LLMInferenceService status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current LLMInferenceService generation"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "LLMInferenceService is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "LLMInferenceService is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the LLMInferenceService Ready condition"
        return hs
    - group: inference.opendatahub.io
      kind: ExternalModel
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalModel status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current ExternalModel generation"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ExternalModel is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ExternalModel is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ExternalModel Ready condition"
        return hs
    - group: maas.opendatahub.io
      kind: MaaSModelRef
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for MaaSModelRef status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current MaaSModelRef generation"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "MaaSModelRef is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "MaaSModelRef is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the MaaSModelRef Ready condition"
        return hs
    - group: maas.opendatahub.io
      kind: MaaSSubscription
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for MaaSSubscription status"
          return hs
        end
        local failedPhases = {
          Degraded = true,
          Failed = true,
          Invalid = true
        }
        if failedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = "MaaSSubscription phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = "MaaSSubscription is pending"
          return hs
        end
        for _, status in ipairs(obj.status.modelRefStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS model reference is not ready"
            return hs
          end
        end
        for _, status in ipairs(obj.status.flowControlStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS model flow control is not ready"
            return hs
          end
        end
        for _, status in ipairs(obj.status.tokenRateLimitStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS token rate limit is not ready"
            return hs
          end
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if obj.metadata.generation ~= nil and condition.observedGeneration ~= nil and condition.observedGeneration < obj.metadata.generation then
              hs.status = "Progressing"
              hs.message = "Waiting for the current MaaSSubscription generation"
              return hs
            end
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "MaaSSubscription is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "MaaSSubscription is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
