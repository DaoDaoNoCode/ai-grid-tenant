          Failed = true,
          Invalid = true
        }
        if failedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = "MaaSAuthPolicy phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
