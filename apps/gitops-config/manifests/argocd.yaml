apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The controller now caches both the in-cluster destination and the
  # GitOpsCluster proxy destination; 2 GiB is not enough during startup.
  controller:
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
  # RedisReplication is intentionally omitted because the Redis operator does
  # not currently populate a resource status for Argo to evaluate.
  resourceHealthChecks:
    - group: postgresql.cnpg.io
      kind: Cluster
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG cluster status"
          return hs
        end
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
          hs.message = obj.status.phase
          return hs
        end
        local degradedPhases = {
          ["Cluster is unrecoverable and needs manual intervention"] = true,
          ["Cluster cannot proceed to reconciliation due to an unknown plugin being required"] = true,
          ["Cluster cannot proceed to reconciliation due to an error while interacting with plugins"] = true,
          ["Cluster has incomplete or invalid image catalog"] = true,
          ["Invalid cluster definition"] = true
        }
        if degradedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = obj.status.phase
          if obj.status.phaseReason ~= nil then
            hs.message = hs.message .. ": " .. obj.status.phaseReason
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = obj.status.phase
        return hs
    - group: external-secrets.io
      kind: ExternalSecret
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalSecret status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ExternalSecret synchronized"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ExternalSecret synchronization failed"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ExternalSecret Ready condition"
        return hs
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status == nil or obj.status.state == nil or obj.status.installedCSV == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for the operator subscription to install"
          return hs
        end
        if obj.status.state == "AtLatestKnown" then
          hs.status = "Healthy"
          hs.message = "Operator subscription is at the latest known CSV"
          return hs
        end
        if obj.status.state == "Failed" then
          hs.status = "Degraded"
          hs.message = "Operator subscription failed"
          if obj.status.currentCSV ~= nil then
            hs.message = hs.message .. ": " .. obj.status.currentCSV
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Operator subscription state: " .. obj.status.state
        return hs
    - group: operator.openshift.io
      kind: ExternalSecretsConfig
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for External Secrets operand status"
          return hs
        end
        local ready = false
        local degraded = false
        local message = "Waiting for External Secrets operand conditions"
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            ready = condition.status == "True"
            message = condition.message or message
          elseif condition.type == "Degraded" and condition.status == "True" then
            degraded = true
            message = condition.message or message
          end
        end
        if degraded then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if ready then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = message
        return hs
    - group: generators.external-secrets.io
      kind: Password
      check: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Password generator resource is present"
        return hs
    - group: postgresql.cnpg.io
      kind: Database
      check: |
        hs = {}
        if obj.status == nil or obj.status.applied == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG database status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current CloudNativePG database generation"
          return hs
        end
        if obj.status.applied then
          hs.status = "Healthy"
          hs.message = "CloudNativePG database reconciliation applied"
          return hs
        end
        hs.status = "Degraded"
        hs.message = obj.status.message or "CloudNativePG database reconciliation failed"
        return hs
    - group: postgresql.cnpg.io
      kind: DatabaseRole
      check: |
        hs = {}
        if obj.status == nil or obj.status.applied == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG database role status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current CloudNativePG database role generation"
          return hs
        end
        if obj.status.applied then
          hs.status = "Healthy"
          hs.message = "CloudNativePG database role reconciliation applied"
          return hs
        end
        hs.status = "Degraded"
        hs.message = obj.status.message or "CloudNativePG database role reconciliation failed"
        return hs
    - group: route.openshift.io
      kind: Route
      check: |
        hs = {}
        if obj.status == nil or obj.status.ingress == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for OpenShift Route admission"
          return hs
        end
        for _, ingress in ipairs(obj.status.ingress) do
          local conditions = ingress.conditions or {}
          for _, condition in ipairs(conditions) do
            if condition.type == "Admitted" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or "OpenShift Route admitted"
                return hs
              elseif condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message or "OpenShift Route admission failed"
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the OpenShift Route Admitted condition"
        return hs
    - group: limitador.kuadrant.io
      kind: Limitador
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for Limitador status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current Limitador generation"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the Limitador Ready condition"
        return hs
    - group: multicluster.x-k8s.io
      kind: ServiceExport
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ServiceExport status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Valid" and condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message
            return hs
          end
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ServiceExport Ready condition"
        return hs
    - group: addon.open-cluster-management.io
      kind: ManagedClusterAddOn
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ManagedClusterAddOn status"
          return hs
        end
        local available = false
        local progressing = false
        local degradedTypes = {
          Degraded = true,
          SubmarinerAgentDegraded = true,
          SubmarinerConnectionDegraded = true,
          RouteAgentConnectionDegraded = true
        }
        for _, condition in ipairs(obj.status.conditions) do
          if condition.status == "True" then
            if degradedTypes[condition.type] then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            elseif condition.type == "Progressing" then
              progressing = true
            elseif condition.type == "Available" then
              available = true
            end
          end
        end
        if progressing then
          hs.status = "Progressing"
          hs.message = "ManagedClusterAddOn is progressing"
          return hs
        end
        if available then
          hs.status = "Healthy"
          hs.message = "ManagedClusterAddOn is available"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ManagedClusterAddOn Available condition"
        return hs
    - group: submarineraddon.open-cluster-management.io
      kind: SubmarinerConfig
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for SubmarinerConfig status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "SubmarinerConfigApplied" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the SubmarinerConfigApplied condition"
        return hs
