apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Applied by hand on a dedicated hub whose MaaS state runs on a labelled site.
  # Neither root ApplicationSet generates it: both run that state on the hub
  # through the keycloak, limitador-redis, external-secrets and maas-db apps.
  name: external-services
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ai-grid-cloud/ai-grid-cluster-gitops.git
    targetRevision: HEAD
    path: apps/external-services/hub
  # maas-db, created untracked, holds the rhoai app's tenant RBAC Role; this
  # app's own objects name the external-services namespace.
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
