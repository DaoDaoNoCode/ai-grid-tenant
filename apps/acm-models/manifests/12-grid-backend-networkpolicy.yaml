# KServe admits the workload port from openshift-ingress and the monitoring
# namespaces only, so the gateway's dial is dropped without this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: grid-gateway-backend
  namespace: ai-grid-internal-models
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: llminferenceservice
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ai-grid
