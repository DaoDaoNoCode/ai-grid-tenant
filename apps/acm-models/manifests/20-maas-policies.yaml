apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    openshift.io/display-name: ocp-users
  name: ocp-users
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: facebook-opt-125m
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 1000
      window: 1m
  owner:
    groups:
    - name: system:authenticated
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/description: Auth policy created for subscription "ocp-users"
  name: ocp-users-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: facebook-opt-125m
    namespace: models-as-a-service
  subjects:
    groups:
    - name: system:authenticated
