# The scheduler's /metrics needs a bearer token, so the collector gets its own
# reader rather than a copy of someone else's token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grid-epp-metrics-reader
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: grid-epp-metrics-reader-token
  namespace: redhat-ai-grid
  annotations:
    kubernetes.io/service-account.name: grid-epp-metrics-reader
    argocd.argoproj.io/sync-wave: "3"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grid-epp-metrics-reader
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kserve-metrics-reader-cluster-role
subjects:
  - kind: ServiceAccount
    name: grid-epp-metrics-reader
    namespace: redhat-ai-grid
