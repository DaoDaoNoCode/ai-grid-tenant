# Federating the cluster's user-workload Prometheus needs a token that may read
# metrics cluster-wide, so the collector gets its own reader.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grid-uwm-federate-reader
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: grid-uwm-federate-reader-token
  namespace: open-cluster-management-observability
  annotations:
    kubernetes.io/service-account.name: grid-uwm-federate-reader
    argocd.argoproj.io/sync-wave: "3"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grid-uwm-federate-reader
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: grid-uwm-federate-reader
    namespace: open-cluster-management-observability
