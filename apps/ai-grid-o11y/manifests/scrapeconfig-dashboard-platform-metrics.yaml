# Platform metrics the Perses dashboards query that ACM's default platform list leaves out. Each
# cluster's own Prometheus already records them; this asks the multicluster-observability addon
# to federate them to the hub's Thanos, next to the default platform-metrics ScrapeConfig.
#   accelerator_gpu_utilization: the NVIDIA GPU Operator's recording rule over the DCGM exporter
#     (PrometheusRule nvidia-dcgm-exporter in nvidia-gpu-operator); the cluster dashboard's GPU
#     utilization panels.
#   node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate: OpenShift's
#     platform recording rule; the model dashboard's Model deployments table (CPU).
# The addon applies a ScrapeConfig only once it is listed in its ClusterManagementAddOn:
# rhoai-prerequisites/hub/13-rhai-metrics-addon-policy.yaml registers this one.
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  name: ai-grid-dashboard-platform-metrics
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/component: platform-metrics-collector
    app.kubernetes.io/part-of: multicluster-observability-addon
spec:
  jobName: ai-grid-dashboard-platform-metrics
  metricsPath: /federate
  params:
    match[]:
      - '{__name__="accelerator_gpu_utilization"}'
      - '{__name__="node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate"}'
