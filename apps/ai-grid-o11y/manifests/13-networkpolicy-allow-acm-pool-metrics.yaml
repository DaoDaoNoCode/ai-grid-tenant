# The model namespace admits the three monitoring namespaces on the scheduler and
# engine metrics ports, and the fleet collector is not one of them. Policies are
# additive, so this complements the one KServe renders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acm-pool-metrics
  namespace: ai-grid-internal-models
  labels:
    app.kubernetes.io/component: user-workload-metrics-collector
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-cluster-management-agent-addon
      ports:
        - port: 9090
          protocol: TCP
        - port: 8000
          protocol: TCP
