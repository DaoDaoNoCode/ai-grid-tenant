# The engine series the dashboard's pool rows read. The cluster's own
# user-workload monitoring already scrapes every model pod, so this federates
# that result rather than naming each model namespace.
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  name: vllm-metrics
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/component: user-workload-metrics-collector
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  jobName: vllm-metrics
  metricsPath: /federate
  scrapeInterval: 30s
  scheme: HTTPS
  params:
    match[]:
      - '{__name__=~"vllm:.*"}'
  authorization:
    credentials:
      name: grid-uwm-federate-reader-token
      key: token
  tlsConfig:
    ca:
      configMap:
        name: openshift-service-ca.crt
        key: service-ca.crt
    serverName: prometheus-user-workload.openshift-user-workload-monitoring.svc
  # honorLabels stays off on purpose: the payload's own job and instance land as
  # exported_*, which is what the fleet collector's remote write maps back.
  staticConfigs:
    - targets:
        - prometheus-user-workload.openshift-user-workload-monitoring.svc:9092
