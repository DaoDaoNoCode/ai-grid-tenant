fullnameOverride: grid-enrollment
host: grid-enrollment.grid-enrollment.svc.clusterset.local
route:
  enabled: false
serving:
  extraDnsNames:
    - grid-enrollment.grid-enrollment.svc.clusterset.local
enrollment:
  authz: kube
  service:
    type: ClusterIP
  inviteSecrets:
    namespace: grid-enrollment-invites
db:
  type: builtin
  builtin:
    pvcAnnotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
hubSite:
  name: local-cluster
  namespace: redhat-ai-grid
  identitySecretName: grid-site-identity
  caSecretName: grid-ca
  swimKeySecretName: grid-swim-key
  seedSecretName: grid-reserved-seeds
