apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grid-enrollment
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/component: enrollment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ai-grid
        - ipBlock:
            cidr: 242.0.0.0/8
      ports:
        - protocol: TCP
          port: 8443
