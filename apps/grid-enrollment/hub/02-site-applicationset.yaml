apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grid-enrollment-sites
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'grid-site-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: https://github.com/kahowell/ai-grid-tenant.git
        targetRevision: HEAD
        path: apps/grid-enrollment/site
        helm:
          releaseName: 'grid-site-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
          parameters:
            - name: siteName
              value: '{{.name}}'
            - name: clusterName
              value: '{{.name}}'
            - name: siteSlug
              value: '{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
