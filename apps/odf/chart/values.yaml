# The ODF operator channel tracks the cluster's OpenShift minor version
# (stable-<major.minor>). There is deliberately no default: both root
# ApplicationSets set it from the hub's openshiftVersion-major-minor label, and
# rendering fails rather than guessing when it is missing.
openshift:
  version: ""

# OLM fails every CSV in a namespace with two OperatorGroups. Set false when
# openshift-storage already has one, for example from an LVMS install.
operatorGroup:
  create: true
