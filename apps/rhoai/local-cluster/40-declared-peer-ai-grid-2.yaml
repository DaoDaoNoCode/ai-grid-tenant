# A lab declaration, not the product shape. The hub learns a peer's providers
# only through gossip, which cannot work between these two clusters, so the peer
# is declared here instead: resolve_sites reads a GridSite's labels and its key
# is the object name, so a provider selecting this label emits candidates for
# ai-grid-2. A declared signals endpoint on GridSite replaces all of this.
apiVersion: grid.praxis.fast/v1alpha1
kind: GridSite
metadata:
  name: ai-grid-2
  labels:
    grid.hexfusion.io/declared-peer: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gridNetworkRef: grid
---
# clusterName is the candidate's cluster, and matches the backend the consumer
# gateway declares for this peer.
apiVersion: grid.praxis.fast/v1alpha1
kind: InferenceProvider
metadata:
  name: peer-ai-grid-2-opt-125m
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gridNetworkRef: grid
  providerKind: vllm
  backendKind: local_model
  clusterName: peer-ai-grid-2
  endpoint: https://acdde7d1719c548b389463fbfdcbd50b-cb824f9f36b9f8f0.elb.us-west-2.amazonaws.com:8080/v1
  siteSelector:
    matchLabels:
      grid.hexfusion.io/declared-peer: "true"
  models:
    - name: facebook/opt-125m
      capabilities:
        - text_generation
