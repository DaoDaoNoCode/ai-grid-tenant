# The serving config names this cluster's provider after a hash of the local
# LLMInferenceService UID, and grid_site_route can only select a cluster it
# declares, so the name is local to this file.
praxis-gateway:
  praxisConfig:
    render:
      backends:
        - cluster: grid-ai-grid-internal-models-fa5d29f44274630a4c1f0377cb458dfa16
          endpoints:
            - facebook-opt-125m-kserve-workload-svc.ai-grid-internal-models.svc.cluster.local.:8000
          transport:
            mode: tls
            ca:
              configMapName: openshift-service-ca.crt
              key: service-ca.crt
          # praxis refuses a name that resolves to a private address.
          trustPrivate: true
        # The peer's provider gateway. No SNI here, so the chart defaults it to
        # ai-grid-2.grid.internal, the name the peer's leaf carries.
        - cluster: peer-ai-grid-2
          site: ai-grid-2
          endpoints:
            - acdde7d1719c548b389463fbfdcbd50b-cb824f9f36b9f8f0.elb.us-west-2.amazonaws.com:8080
          transport:
            mode: mutual_tls
