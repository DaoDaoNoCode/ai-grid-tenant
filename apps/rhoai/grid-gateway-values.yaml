image:
  repository: ghcr.io/praxis-proxy/grid-gateway
  tag: v0.2.2
  flavor: grid-gateway

praxisConfig:
  source: operator
  operator:
    configMapName: praxis-consumer-config

mountReconciliation:
  enabled: true
  network: grid
  releaseHelmMounts: false
  managedCredentialNames:
    - grid-model-client-token
  operator:
    serviceAccount: grid-operator
    namespace: redhat-ai-grid

gridIdentity:
  tlsSecretName: grid-site-identity
  caSecretName: grid-ca
  mountPath: /etc/praxis/tls

providerCredentials:
  - secretName: grid-model-client-token

service:
  enabled: true
  type: ClusterIP
  port: 8080

health:
  readiness:
    tcpSocket: {}
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    tcpSocket: {}
    initialDelaySeconds: 10
    periodSeconds: 10
