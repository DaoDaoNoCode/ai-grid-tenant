apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Generates one Application for every cluster secret created by the
  # acm-models GitOpsCluster resource, including local-cluster.
  name: rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'rhoai-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          ref: values
        # Pinned to a fork commit carrying operator.olm.createNamespace until
        # the change is available upstream. This lets ACM own protected
        # Namespaces while the chart still owns the OLM operator resources.
        - repoURL: https://github.com/pierDypi/odh-gitops.git
          targetRevision: c1be9382ef7da230d4fd3ba003d42e443804c81e
          path: charts/rhai-on-openshift-chart
          helm:
            releaseName: rhai-on-openshift
            valueFiles:
              - $values/apps/rhoai/values.yaml
            parameters:
              - name: grid-enrollment.enabled
                value: '{{ eq .name "local-cluster" | toString }}'
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/manifests
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/catalog
          helm:
            releaseName: rhoai-nightly-catalog
            valueFiles:
              - $values/apps/rhoai/nightly.yaml
      destination:
        server: '{{.server}}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: grid-model-client-token
          namespace: redhat-ai-grid
          jsonPointers:
            - /data
            - /metadata/annotations
        - group: ""
          kind: ConfigMap
          name: praxis-consumer-config
          namespace: redhat-ai-grid
          jsonPointers:
            - /data
        - group: grid.praxis.fast
          kind: GridNetwork
          name: grid
          jsonPointers:
            - /spec/consumerGateways/0/praxisConfig/deriveTopology/fromProviders
        - group: apps
          kind: Deployment
          name: 'grid-gw-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
          namespace: redhat-ai-grid
          jsonPointers:
            - /metadata/annotations
            - /spec/template/metadata/annotations
            - /spec/template/spec/volumes
          jqPathExpressions:
            - '.spec.template.spec.containers[] | select(.name == "praxis") | .volumeMounts'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          # Protected Namespaces are owned by ACM or the platform, and the
          # chart omits them through createNamespace=false.
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
