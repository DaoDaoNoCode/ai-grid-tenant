apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-tenant
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: rhoai-tenant-templating
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-aitenant
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - ai-tenants
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: AITenant
                metadata:
                  name: models-as-a-service
                  namespace: ai-tenants
                spec:
                  gateway:
                    name: maas-default-gateway
                  oidc:
                    accessTokenPurpose: access
                    accessTokenPurposeClaim: token_use
                    clientId: tenant-demo
                    audience: tenant-demo
                    issuerUrl: '{{hub printf "https://%s/realms/saas" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maastenantconfig
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - models-as-a-service
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  telemetry:
                    enabled: true
                    metrics:
                      captureModelUsage: true
                      captureUser: true
                      captureGroup: true
                      captureOrganization: true
                    logs:
                      captureUser: true
                      captureOrganization: true
