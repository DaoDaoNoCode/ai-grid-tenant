# Peers dial this directly, so the SNI stays <site>.grid.internal and matches the leaf.
fullnameOverride: grid-provider-gateway
# A standalone release does not inherit the umbrella's pin, and the chart's own
# default predates client_cert_mode require_named.
image:
  flavor: grid-gateway
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9
  digest: sha256:991f24ee2ce66b36bdc68f34f226d7fd81c6826a1221f1a3e0fde59fad78e1ea
grid:
  networkName: grid
praxisConfig:
  source: render
  render:
    role: provider
    peerTrust:
      mode: spiffe
      spiffeIds:
        - spiffe://grid.internal/site/ai-grid-2
    backends:
      - cluster: local-model
        endpoints:
          - facebook-opt-125m-kserve-workload-svc.ai-grid-internal-models.svc.cluster.local.:8000
        transport:
          mode: tls
          ca:
            configMapName: openshift-service-ca.crt
            key: service-ca.crt
        # praxis refuses a name that resolves to a private address.
        trustPrivate: true
gridIdentity:
  tlsSecretName: grid-site-identity
  caSecretName: grid-ca
  mountPath: /etc/praxis/tls
service:
  type: LoadBalancer
# Without platform the chart emits no cloud annotations, and the AWS controller
# reads an absent internal annotation as internal.
platform: aws
# A peer in another region reaches this, and AWS fixes the scope when the load
# balancer is created.
loadBalancerScope: external
networkPolicy:
  # A peer arrives through the load balancer, and externalTrafficPolicy Cluster
  # translates it to the address of the node that received it. The peer itself is
  # authenticated by its certificate and SPIFFE id on the listener, not here.
  from:
    - podSelector:
        matchLabels:
          grid.opendatahub.io/gateway-client: "true"
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    - ipBlock:
        cidr: 10.0.0.0/16
