# Declared because nothing generates consumerGateways, and the operator writes
# serving data only per entry. Adopting the record the operator created means
# tls and peerTrust must be restated or Argo would strip them.
#
# signalTransport rides along: serving data is only written in poll mode, and
# the mode is a property of the grid, not of one operator.
apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: grid
spec:
  signalTransport:
    mode: poll
  peerTrust:
    mode: spiffe
  tls:
    siteSecretRef:
      name: grid-site-identity
      namespace: redhat-ai-grid
    caSecretRef:
      name: grid-ca
      namespace: redhat-ai-grid
    swimKeySecretRef:
      name: grid-swim-key
      namespace: redhat-ai-grid
  consumerGateways:
    - name: grid-gateway
      namespace: redhat-ai-grid
      siteName: local-cluster
