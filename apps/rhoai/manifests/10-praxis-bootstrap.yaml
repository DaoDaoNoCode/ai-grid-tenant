apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-consumer-config
  namespace: redhat-ai-grid
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  praxis.yaml: |
    listeners:
      - name: public
        address: "0.0.0.0:8080"
        filter_chains:
          - bootstrap
    filter_chains:
      - name: bootstrap
        filters:
          - filter: credential_inject
            credentials: []
            projected_credential_mount_base: /run/secrets/grid-credentials
          - filter: static_response
            status: 503
            headers:
              - name: Content-Type
                value: application/json
            body: '{"error":"grid routing configuration is not ready"}'
    admin:
      metrics_address: "127.0.0.1:9901"
